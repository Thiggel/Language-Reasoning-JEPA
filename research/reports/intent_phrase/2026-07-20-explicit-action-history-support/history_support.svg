<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Candidate intent attends to the causal executed-intent prefix</title>
  <desc id="desc">A candidate action phrase queries only earlier executed or imagined intent phrases through attention. The resulting learned availability score combines with the behavioral prior. A matched negative control masks the history while keeping the same architecture.</desc>
  <rect width="900" height="250" fill="#fbfbf7"/>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <rect x="25" y="35" width="210" height="65" rx="9" fill="#dcecff" stroke="#315b7d"/><text x="130" y="63">Candidate phrase</text><text x="130" y="86">“derive C from A + B”</text>
    <rect x="25" y="150" width="300" height="65" rx="9" fill="#e8f4df" stroke="#4f762f"/><text x="175" y="178">Causal intent prefix only</text><text x="175" y="201">look up A · look up B · …</text>
    <path d="M235 68 H390" stroke="#444" stroke-width="3" marker-end="url(#a)"/><path d="M325 183 H390" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
    <rect x="390" y="80" width="170" height="100" rx="9" fill="#fff0c9" stroke="#94701d"/><text x="475" y="119">4-head lexical</text><text x="475" y="145">history attention</text>
    <path d="M560 130 H650" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
    <rect x="650" y="85" width="220" height="90" rx="9" fill="#eee4fa" stroke="#69488a"/><text x="760" y="119">Learned availability</text><text x="760" y="145">+ behavioral prior</text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#444"/></marker></defs>
</svg>

