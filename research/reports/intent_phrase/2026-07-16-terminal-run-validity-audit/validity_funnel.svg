<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Validity funnel for the newly listed intent-phrase jobs</title>
  <desc id="desc">Ten scheduled run slots narrow to nine terminal summaries, then zero runs that entered valid scientific comparison.</desc>
  <rect width="960" height="520" fill="#fbfaf7"/>
  <text x="480" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#17202a">A run must pass process gates before its score means anything</text>
  <polygon points="90,90 870,90 790,190 170,190" fill="#3b82f6"/>
  <text x="480" y="135" text-anchor="middle" font-family="sans-serif" font-size="26" fill="white">10 scheduled slots named by the audit</text>
  <text x="480" y="169" text-anchor="middle" font-family="sans-serif" font-size="18" fill="white">7 GAR geometry + 3 counterfactual outcome</text>
  <polygon points="170,215 790,215 700,315 260,315" fill="#f59e0b"/>
  <text x="480" y="257" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#332500">9 terminal summaries present</text>
  <text x="480" y="291" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#332500">7 timeouts + 2 failures; seed 0 has no summary</text>
  <polygon points="260,340 700,340 620,440 340,440" fill="#dc2626"/>
  <text x="480" y="385" text-anchor="middle" font-family="sans-serif" font-size="27" fill="white">0 valid scientific results</text>
  <text x="480" y="418" text-anchor="middle" font-family="sans-serif" font-size="18" fill="white">no metrics, no declared artifacts, no comparison</text>
  <text x="480" y="485" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#374151">Process failure ≠ evidence that the model idea failed</text>
</svg>
