<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Stored candidate ranking is high while full catalogue ranking falls</title>
  <desc id="desc">For ProofWriter and PlanBench, stored-label top-one is above ninety-four percent, but full-catalogue expert top-one is thirty-three and twelve percent, and closed-loop success is zero.</desc>
  <rect width="760" height="300" fill="white"/>
  <text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="18">The model fits supervised choices, not the unsupervised catalogue</text>
  <line x1="80" y1="245" x2="730" y2="245" stroke="#333"/>
  <line x1="80" y1="45" x2="80" y2="245" stroke="#333"/>
  <g font-family="sans-serif" font-size="12" fill="#333">
    <text x="68" y="249" text-anchor="end">0%</text>
    <text x="68" y="199" text-anchor="end">25%</text>
    <text x="68" y="149" text-anchor="end">50%</text>
    <text x="68" y="99" text-anchor="end">75%</text>
    <text x="68" y="49" text-anchor="end">100%</text>
    <text x="245" y="270" text-anchor="middle">ProofWriter</text>
    <text x="555" y="270" text-anchor="middle">PlanBench-3</text>
  </g>
  <g fill="#4c78a8">
    <rect x="160" y="52" width="55" height="193"/>
    <rect x="470" y="56" width="55" height="189"/>
  </g>
  <g fill="#f58518">
    <rect x="225" y="178" width="55" height="67"/>
    <rect x="535" y="221" width="55" height="24"/>
  </g>
  <g fill="#e45756">
    <rect x="290" y="245" width="55" height="0"/>
    <rect x="600" y="245" width="55" height="0"/>
  </g>
  <g font-family="sans-serif" font-size="12">
    <rect x="190" y="283" width="12" height="12" fill="#4c78a8"/><text x="208" y="294">stored GAR top-1</text>
    <rect x="340" y="283" width="12" height="12" fill="#f58518"/><text x="358" y="294">full-catalogue expert top-1</text>
    <rect x="550" y="283" width="12" height="12" fill="#e45756"/><text x="568" y="294">train success</text>
  </g>
</svg>
