<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="A broad command catalogue narrows to feasible commands, but the connection from feasible commands to the goal is broken">
  <rect width="900" height="260" fill="#faf8f2"/>
  <rect x="40" y="70" width="220" height="110" rx="14" fill="#dce9f5" stroke="#35658b" stroke-width="3"/>
  <text x="150" y="112" text-anchor="middle" font-family="sans-serif" font-size="22">Broad catalogue</text>
  <text x="150" y="145" text-anchor="middle" font-family="sans-serif" font-size="17">mostly invalid commands</text>
  <path d="M270 125 H360" stroke="#35658b" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="375" y="70" width="220" height="110" rx="14" fill="#dff0df" stroke="#3f7a45" stroke-width="3"/>
  <text x="485" y="112" text-anchor="middle" font-family="sans-serif" font-size="22">Feasible commands</text>
  <text x="485" y="145" text-anchor="middle" font-family="sans-serif" font-size="17">learned at higher rates</text>
  <path d="M605 125 H680" stroke="#a33" stroke-width="8" stroke-dasharray="18 12"/>
  <text x="642" y="103" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#a33">×</text>
  <rect x="700" y="70" width="160" height="110" rx="55" fill="#f5dfb8" stroke="#966c1f" stroke-width="3"/>
  <text x="780" y="132" text-anchor="middle" font-family="sans-serif" font-size="23">Goal solved</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35658b"/></marker></defs>
</svg>
