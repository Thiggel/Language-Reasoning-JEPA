<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Token-level causal prerequisite matching</title>
  <desc id="desc">Candidate intent tokens attend to tokens from already executed intents. Hidden graph edges and future menus are blocked.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34495e"/></marker></defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <rect x="35" y="45" width="245" height="90" rx="12" fill="#d6eaf8" stroke="#2874a6" stroke-width="2"/>
  <text x="157" y="72" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold">Candidate intent tokens</text>
  <text x="157" y="102" text-anchor="middle" font-family="monospace" font-size="15">derive blue keys</text>
  <text x="157" y="123" text-anchor="middle" font-family="monospace" font-size="15">from red pens</text>
  <rect x="35" y="195" width="245" height="90" rx="12" fill="#d5f5e3" stroke="#239b56" stroke-width="2"/>
  <text x="157" y="222" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold">Executed intent tokens</text>
  <text x="157" y="252" text-anchor="middle" font-family="monospace" font-size="15">derive red pens ...</text>
  <rect x="355" y="92" width="215" height="145" rx="12" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="462" y="125" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Token attention</text>
  <text x="462" y="155" text-anchor="middle" font-family="sans-serif" font-size="15">exact lexical matches</text>
  <text x="462" y="180" text-anchor="middle" font-family="sans-serif" font-size="15">strict earlier prefix only</text>
  <text x="462" y="205" text-anchor="middle" font-family="sans-serif" font-size="15">no future menu</text>
  <rect x="645" y="105" width="215" height="115" rx="12" fill="#ebdef0" stroke="#7d3c98" stroke-width="2"/>
  <text x="752" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Availability score</text>
  <text x="752" y="172" text-anchor="middle" font-family="sans-serif" font-size="15">candidate + history</text>
  <text x="752" y="197" text-anchor="middle" font-family="sans-serif" font-size="15">+ frozen JEPA state</text>
  <line x1="280" y1="90" x2="350" y2="130" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="280" y1="240" x2="350" y2="200" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="570" y1="164" x2="640" y2="164" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="307" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#922b21">Blocked: symbolic graph edges, resolved-set query, and future feasible actions</text>
</svg>
