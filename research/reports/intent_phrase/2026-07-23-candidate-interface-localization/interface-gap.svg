<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Feasible-only evaluation exposes hidden reasoning success</title>
  <desc id="desc">At four excess actions, ProofWriter rises from zero percent full-catalogue success to eighty-seven point five percent feasible-only success, and PlanBench rises from twelve point five to fifty percent.</desc>
  <rect width="760" height="330" fill="white"/>
  <text x="380" y="30" text-anchor="middle" font-family="sans-serif" font-size="18">Success at +4 actions, best aligned checkpoint per domain</text>
  <line x1="90" y1="255" x2="720" y2="255" stroke="#333"/>
  <line x1="90" y1="55" x2="90" y2="255" stroke="#333"/>
  <g font-family="sans-serif" font-size="12" fill="#333">
    <text x="76" y="259" text-anchor="end">0%</text>
    <text x="76" y="209" text-anchor="end">25%</text>
    <text x="76" y="159" text-anchor="end">50%</text>
    <text x="76" y="109" text-anchor="end">75%</text>
    <text x="76" y="59" text-anchor="end">100%</text>
    <text x="255" y="280" text-anchor="middle">ProofWriter</text>
    <text x="550" y="280" text-anchor="middle">PlanBench-3</text>
  </g>
  <rect x="180" y="255" width="65" height="0" fill="#4c78a8"/>
  <rect x="260" y="80" width="65" height="175" fill="#59a14f"/>
  <rect x="475" y="230" width="65" height="25" fill="#4c78a8"/>
  <rect x="555" y="155" width="65" height="100" fill="#59a14f"/>
  <g font-family="sans-serif" font-size="12" fill="#111">
    <text x="212" y="247" text-anchor="middle">0%</text>
    <text x="292" y="73" text-anchor="middle">87.5%</text>
    <text x="507" y="223" text-anchor="middle">12.5%</text>
    <text x="587" y="148" text-anchor="middle">50%</text>
    <rect x="245" y="305" width="12" height="12" fill="#4c78a8"/><text x="263" y="316">full catalogue</text>
    <rect x="405" y="305" width="12" height="12" fill="#59a14f"/><text x="423" y="316">oracle-feasible diagnostic</text>
  </g>
</svg>
