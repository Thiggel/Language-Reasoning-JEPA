<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Map of the intent-phrase JEPA method handbook</title>
  <desc id="desc">A left-to-right flow from task interface through model, GAR and multi-step teacher, planning, evaluation, and representation analysis. Controls connect beneath training and planning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}.accent{fill:#e0f2fe;stroke:#0369a1}.control{fill:#fef3c7;stroke:#a16207}.analysis{fill:#dcfce7;stroke:#15803d}.t{font:600 18px sans-serif;fill:#0f172a}.s{font:14px sans-serif;fill:#334155}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="box" x="30" y="55" width="160" height="90"/><text class="t" x="110" y="88" text-anchor="middle">Task interface</text><text class="s" x="110" y="115" text-anchor="middle">prompt, history,</text><text class="s" x="110" y="135" text-anchor="middle">feasible intents</text>
  <rect class="box" x="230" y="55" width="160" height="90"/><text class="t" x="310" y="88" text-anchor="middle">JEPA model</text><text class="s" x="310" y="115" text-anchor="middle">state, action,</text><text class="s" x="310" y="135" text-anchor="middle">predicted successor</text>
  <rect class="accent" x="430" y="35" width="180" height="130" rx="12"/><text class="t" x="520" y="73" text-anchor="middle">GAR training</text><text class="s" x="520" y="100" text-anchor="middle">local action ordering</text><text class="s" x="520" y="122" text-anchor="middle">H-step teacher target</text><text class="s" x="520" y="144" text-anchor="middle">calibrated Energy</text>
  <rect class="box" x="650" y="55" width="160" height="90"/><text class="t" x="730" y="88" text-anchor="middle">Planning</text><text class="s" x="730" y="115" text-anchor="middle">latent beam, terminal</text><text class="s" x="730" y="135" text-anchor="middle">Energy, replan</text>
  <rect class="box" x="850" y="55" width="160" height="90"/><text class="t" x="930" y="88" text-anchor="middle">Evaluation</text><text class="s" x="930" y="115" text-anchor="middle">success, excess,</text><text class="s" x="930" y="135" text-anchor="middle">length and compute</text>
  <path class="line" d="M190 100 H230"/><path class="line" d="M390 100 H430"/><path class="line" d="M610 100 H650"/><path class="line" d="M810 100 H850"/>
  <rect class="control" x="320" y="245" width="300" height="110" rx="12"/><text class="t" x="470" y="280" text-anchor="middle">Matched controls</text><text class="s" x="470" y="307" text-anchor="middle">counterfactual-only, true-state,</text><text class="s" x="470" y="329" text-anchor="middle">direct ranker, state Energy, oracle</text>
  <rect class="analysis" x="690" y="245" width="300" height="110" rx="12"/><text class="t" x="840" y="280" text-anchor="middle">Representation analysis</text><text class="s" x="840" y="307" text-anchor="middle">local ordering, margins, probes,</text><text class="s" x="840" y="329" text-anchor="middle">minimal pairs, rollout drift</text>
  <path class="line" d="M520 165 V220 H470 V245"/><path class="line" d="M730 145 V205 H840 V245"/><path class="line" d="M620 300 H690"/>
  <text class="s" x="30" y="405">Blue: proposed mechanism. Yellow: confound-separating controls. Green: analyses of what the representation encodes and how it supports action choice.</text>
</svg>
