<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">ALFWorld deployment and label information boundary</title>
  <desc id="desc">Observed room text produces a broad non-oracle action catalogue. A selected action enters ALFWorld and returns an observation. Expert plans and legal actions remain behind a dashed label-only boundary.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#243b53"/></marker></defs>
  <rect width="900" height="330" fill="#f7fafc"/>
  <rect x="35" y="70" width="180" height="80" rx="12" fill="#d9f2e6" stroke="#24785a" stroke-width="2"/>
  <text x="125" y="100" text-anchor="middle" font-family="sans-serif" font-size="18">Observed room</text><text x="125" y="127" text-anchor="middle" font-family="sans-serif" font-size="16">and history</text>
  <rect x="280" y="70" width="210" height="80" rx="12" fill="#e3eefc" stroke="#3569a8" stroke-width="2"/>
  <text x="385" y="100" text-anchor="middle" font-family="sans-serif" font-size="18">Fixed grammar +</text><text x="385" y="127" text-anchor="middle" font-family="sans-serif" font-size="16">observed entities</text>
  <rect x="555" y="70" width="140" height="80" rx="12" fill="#fff1cf" stroke="#a66b00" stroke-width="2"/>
  <text x="625" y="101" text-anchor="middle" font-family="sans-serif" font-size="18">Selected</text><text x="625" y="128" text-anchor="middle" font-family="sans-serif" font-size="16">action</text>
  <rect x="750" y="70" width="120" height="80" rx="12" fill="#eadcf8" stroke="#7444a3" stroke-width="2"/>
  <text x="810" y="116" text-anchor="middle" font-family="sans-serif" font-size="18">ALFWorld</text>
  <path d="M215 110 H275" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/><path d="M490 110 H550" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 110 H745" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M810 155 V190 H125 V155" fill="none" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"/><text x="465" y="184" text-anchor="middle" font-family="sans-serif" font-size="15">new natural-language observation</text>
  <line x1="25" y1="230" x2="875" y2="230" stroke="#b24a4a" stroke-width="2" stroke-dasharray="8 7"/><text x="38" y="252" font-family="sans-serif" font-size="14" fill="#8b2f2f">privileged collection labels only</text>
  <rect x="250" y="265" width="180" height="45" rx="10" fill="#fde2e2" stroke="#b24a4a"/><text x="340" y="293" text-anchor="middle" font-family="sans-serif" font-size="16">expert plan</text>
  <rect x="480" y="265" width="210" height="45" rx="10" fill="#fde2e2" stroke="#b24a4a"/><text x="585" y="293" text-anchor="middle" font-family="sans-serif" font-size="16">legal-action menu</text>
</svg>
