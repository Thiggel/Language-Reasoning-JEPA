<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Current endpoint Energy method and evidence boundary</title>
  <desc id="desc">Observed language history is encoded, candidate action sequences are recursively predicted, final endpoints are ranked, and one real action is executed before replanning. Four panels summarize strong feasible-tree depth gains, full-catalogue failure, negative dense supervision, and unresolved horizon support.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.box{fill:#fff;stroke:#263238;stroke-width:2}.main{fill:#e8f1f5;stroke:#28566b;stroke-width:2.5}.good{fill:#e7f3e8;stroke:#39764a;stroke-width:2}.bad{fill:#f8e8e6;stroke:#a64b42;stroke-width:2}.warn{fill:#fff2cf;stroke:#9b7417;stroke-width:2}.t{font:20px sans-serif;fill:#172126}.h{font:bold 24px sans-serif;fill:#172126}.s{font:17px sans-serif;fill:#263238}.arrow{stroke:#455a64;stroke-width:3;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#455a64"/></marker>
  </defs>
  <rect class="bg" width="1200" height="690"/>
  <text class="h" x="600" y="40" text-anchor="middle">Endpoint-Energy JEPA: method and present evidence boundary</text>
  <rect class="main" x="45" y="85" width="220" height="115" rx="16"/>
  <text class="h" x="155" y="122" text-anchor="middle">Observed history</text>
  <text class="s" x="155" y="153" text-anchor="middle">prompt + real outcomes</text>
  <text class="s" x="155" y="178" text-anchor="middle">encode state z</text>
  <rect class="main" x="345" y="85" width="250" height="115" rx="16"/>
  <text class="h" x="470" y="122" text-anchor="middle">Imagine sequences</text>
  <text class="s" x="470" y="153" text-anchor="middle">reuse predictor D times</text>
  <text class="s" x="470" y="178" text-anchor="middle">one endpoint per beam</text>
  <rect class="main" x="675" y="85" width="210" height="115" rx="16"/>
  <text class="h" x="780" y="122" text-anchor="middle">Rank endpoints</text>
  <text class="s" x="780" y="153" text-anchor="middle">lowest Energy wins</text>
  <text class="s" x="780" y="178" text-anchor="middle">no edge-score sum</text>
  <rect class="main" x="965" y="85" width="190" height="115" rx="16"/>
  <text class="h" x="1060" y="122" text-anchor="middle">Act and replan</text>
  <text class="s" x="1060" y="153" text-anchor="middle">execute first action</text>
  <text class="s" x="1060" y="178" text-anchor="middle">observe true result</text>
  <path class="arrow" d="M265 142H337"/><path class="arrow" d="M595 142H667"/><path class="arrow" d="M885 142H957"/>
  <rect class="good" x="45" y="275" width="525" height="155" rx="16"/>
  <text class="h" x="307" y="315" text-anchor="middle">Strong controlled depth result</text>
  <text class="t" x="307" y="352" text-anchor="middle">five-seed strict: .120 -> .834 -> .874 -> .877</text>
  <text class="s" x="307" y="382" text-anchor="middle">depth 1, 4, 8, 16</text>
  <text class="s" x="307" y="407" text-anchor="middle">symbolic future feasible tree for D &gt; 1</text>
  <rect class="bad" x="630" y="275" width="525" height="155" rx="16"/>
  <text class="h" x="892" y="315" text-anchor="middle">No-menu planning fails</text>
  <text class="t" x="892" y="352" text-anchor="middle">best full-catalogue strict &lt; .06</text>
  <text class="s" x="892" y="382" text-anchor="middle">absorbing invalid state helps little</text>
  <text class="s" x="892" y="407" text-anchor="middle">proposal and feasibility remain unsolved</text>
  <rect class="bad" x="45" y="485" width="525" height="155" rx="16"/>
  <text class="h" x="307" y="525" text-anchor="middle">Dense endpoint loss is harmful</text>
  <text class="t" x="307" y="562" text-anchor="middle">repaired H4: .113 / .180 / .183 / .183</text>
  <text class="s" x="307" y="592" text-anchor="middle">final-only endpoint ranking is much stronger</text>
  <text class="s" x="307" y="617" text-anchor="middle">mechanism still needs gradient/drift audit</text>
  <rect class="warn" x="630" y="485" width="525" height="155" rx="16"/>
  <text class="h" x="892" y="525" text-anchor="middle">Horizon semantics need repair</text>
  <text class="t" x="892" y="562" text-anchor="middle">train H in {1,2,4,8}; evaluate through 16</text>
  <text class="s" x="892" y="592" text-anchor="middle">partial beam depths can be unsupported</text>
  <text class="s" x="892" y="617" text-anchor="middle">next: one Energy meaning at every depth</text>
</svg>
