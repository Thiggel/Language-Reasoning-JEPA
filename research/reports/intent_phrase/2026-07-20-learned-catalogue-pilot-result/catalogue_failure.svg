<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img" aria-labelledby="title desc">
  <title id="title">Catalogue proposal coverage and invalid final selection</title>
  <desc id="desc">A prompt catalogue enters availability and prior scoring. The top-four set often contains feasible actions, but the prior was trained only among feasible actions, so an unconstrained infeasible action can win final selection. The correction makes every catalogue action compete in the prior loss.</desc>
  <rect width="920" height="240" fill="#fbfbf7"/>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <rect x="25" y="70" width="170" height="90" rx="10" fill="#dcecff" stroke="#315b7d"/>
    <text x="110" y="105">Prompt-derived</text><text x="110" y="130">action catalogue</text>
    <path d="M195 115 H285" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
    <rect x="285" y="45" width="210" height="140" rx="10" fill="#e8f4df" stroke="#4f762f"/>
    <text x="390" y="80">Top-four proposals</text><text x="390" y="108">often include feasible</text><text x="390" y="136">and necessary actions</text><text x="390" y="164">(.54–.75 / .69–.84)</text>
    <path d="M495 115 H585" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
    <rect x="585" y="45" width="145" height="140" rx="10" fill="#f8dddd" stroke="#9b3b3b"/>
    <text x="658" y="85">Final root</text><text x="658" y="115">almost always</text><text x="658" y="145">infeasible</text><text x="658" y="170">(.93–1.00)</text>
    <path d="M730 115 H790" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
    <rect x="790" y="70" width="105" height="90" rx="10" fill="#fff0c9" stroke="#94701d"/>
    <text x="843" y="105">Train prior</text><text x="843" y="130">globally</text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#444"/></marker></defs>
</svg>

