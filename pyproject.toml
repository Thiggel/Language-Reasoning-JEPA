[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textjepa"
version = "0.1.0"
description = "Language JEPA: latent world models over discourse states and text edits"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy",
    "einops",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "tensorboard",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]
language-planning = [
    "transformers==5.13.0",
    "huggingface-hub==1.26.0",
    "hf-xet==1.5.2",
    "safetensors==0.8.0",
]
visualization = ["umap-learn"]
alfworld = [
    "alfworld @ git+https://github.com/alfworld/alfworld.git@aaba6870f86c5be6a08a491f32a50b906227bc3e",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
