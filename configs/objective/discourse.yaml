latent_pred:
  _target_: textjepa.objectives.LatentPrediction
  weight: 1.0
  kind: smooth_l1
  norm_targets: true
token_aligned_pred:
  _target_: textjepa.objectives.TokenAlignedPrediction
  weight: 0.0
  kind: smooth_l1
  norm_targets: true
token_aligned_rollout:
  _target_: textjepa.objectives.TokenAlignedRolloutPrediction
  weight: 0.0
  kind: smooth_l1
  norm_targets: true
  max_depth: 0
rollout:
  _target_: textjepa.objectives.RolloutPrediction
  weight: 1.0
  kind: smooth_l1
  norm_targets: true
dense_rollout:
  _target_: textjepa.objectives.DenseRolloutPrediction
  weight: 0.0
  kind: smooth_l1
  norm_targets: true
  horizon_discount: 1.0
high_dense_rollout:
  _target_: textjepa.objectives.DenseHierarchyRolloutPrediction
  weight: 0.0
  kind: smooth_l1
  norm_targets: true
  horizon_discount: 1.0
hierarchy:
  _target_: textjepa.objectives.HierarchyPrediction
  weight: 0.5
  kind: smooth_l1
  norm_targets: true
macro_prior:
  _target_: textjepa.objectives.MacroPrior
  weight: 0.0
  free_nats: 0.0
hierarchy_value:
  _target_: textjepa.objectives.HierarchyValueDistill
  weight: 0.0
  scale: 5.0
hierarchy_value_steps:
  _target_: textjepa.objectives.HierarchyValueRegression
  weight: 0.0
high_dense_value:
  _target_: textjepa.objectives.DenseHierarchyValueRegression
  weight: 0.0
  horizon_discount: 1.0
vicreg:
  _target_: textjepa.objectives.VICReg
  weight: 1.0
  std_target: 1.0
  cov_weight: 0.04
  action_weight: 0.1
sigreg:
  _target_: textjepa.objectives.SIGReg
  weight: 0.0
  num_slices: 256
  n_points: 17
  integration_limit: 5.0
delta_action:
  _target_: textjepa.objectives.DeltaAction
  weight: 2.0
  ce_weight: 1.0
  emb_weight: 1.0
observed_action_ldad:
  _target_: textjepa.objectives.ObservedActionLDAD
  weight: 0.0
observed_action_ldad_pred_cycle:
  # Decode the observed phrase from the predictor's imagined displacement.
  # Inert unless model.observed_action_ldad_predictor_cycle=true.
  _target_: textjepa.objectives.ObservedActionLDADPredictorCycle
  weight: 0.0
observed_action_ldad_cf_contrast:
  # Observed cycle score beats each counterfactual candidate's (logistic).
  # Inert unless model.observed_action_ldad_cf_contrast=true and the batch
  # carries ranking counterfactuals.
  _target_: textjepa.objectives.ObservedActionLDADCFContrast
  weight: 0.0
action_generator:
  # Open-ended intent-phrase proposal head. Inert unless the model is built
  # with model.action_generator=true (the loss is then exactly zero), so the
  # nonzero default only takes effect in generator runs.
  _target_: textjepa.objectives.ActionGeneration
  weight: 0.25
value:
  _target_: textjepa.objectives.ValueRegression
  weight: 1.0
chunk_pred:
  _target_: textjepa.objectives.ChunkPrediction
  weight: 0.0  # enabled in experiment configs (see disc_chunkpred)
  rollout_weight: 0.5
straighten:
  _target_: textjepa.objectives.TemporalStraightening
  weight: 0.0  # enabled in experiment configs (see disc_straight/geo)
monotone:
  _target_: textjepa.objectives.GoalMonotonicity
  weight: 0.0  # enabled in experiment configs (see disc_mono/geo)
  margin: 0.02
  distractor_weight: 0.5
value_distill:
  _target_: textjepa.objectives.ValueDistill
  weight: 0.0  # enabled in experiment configs (see disc_distill_v)
  scale: 5.0
gar_action_value:
  _target_: textjepa.objectives.GoalAdvantageDistill
  weight: 0.0
  regression_weight: 1.0
  pairwise_weight: 0.0
  margin: 0.5
  label_gap: 0.001
ranking:
  _target_: textjepa.objectives.ActionRanking
  weight: 0.0  # enabled in experiment configs (see disc_rank_*, edit_rank)
  margin: 0.5
cost_ranking:
  _target_: textjepa.objectives.CostRanking
  weight: 0.0  # enabled in disc_rank_cal
  margin: 0.5
slot_anchor:
  _target_: textjepa.objectives.SlotAnchor
  weight: 0.0  # edit track: per-slot outcome anchor (edit_core5_slot)
action_kl:
  _target_: textjepa.objectives.ActionKL
  weight: 0.0  # variational runs (disc_var)
act_decode:
  _target_: textjepa.objectives.ActionDecode
  weight: 0.0  # variational runs: detached code readout
geo_rank:
  _target_: textjepa.objectives.GeoAdvantageRank
  weight: 0.0  # preference-label-free geometric ranking (disc_georank*)
  margin: 0.5
  label_gap: 0.02
  kind: hinge
  temperature: 0.3
  teacher_temperature: 0.1
geo_advantage_mse:
  _target_: textjepa.objectives.GeoAdvantageRegression
  weight: 0.0
  target_scale: 1.0
geo_energy_mse:
  _target_: textjepa.objectives.GeoEnergyRegression
  weight: 0.0
geo_rollout_energy_mse:
  _target_: textjepa.objectives.GeoRolloutEnergyRegression
  weight: 0.0
geo_rollout_rank:
  _target_: textjepa.objectives.GeoRolloutAdvantageRank
  weight: 0.0
  margin: 0.5
  label_gap: 0.02
  kind: hinge
  temperature: 0.3
  teacher_temperature: 0.1
geo_horizon_rank:
  _target_: textjepa.objectives.GeoHorizonRank
  weight: 0.0
  margin: 0.5
  label_gap: 0.02
  kind: hinge
  temperature: 0.3
  teacher_temperature: 0.1
geo_horizon_energy_mse:
  _target_: textjepa.objectives.GeoHorizonEnergyRegression
  weight: 0.0
geo_horizon_straighten:
  _target_: textjepa.objectives.GeoHorizonStraightening
  weight: 0.0
  projected: false
geo_horizon_monotone:
  _target_: textjepa.objectives.GeoHorizonMonotonicity
  weight: 0.0
  margin: 0.02
  projected: false
td_q:
  _target_: textjepa.objectives.TDQ
  weight: 0.0  # TD-JEPA-adapted SARSA Q baseline (baseline_td_q)
  gamma: 0.98
expectile_value:
  _target_: textjepa.objectives.ExpectileValueTD
  weight: 0.0  # Destrade-style expectile goal value (baseline_expectile_value)
  gamma: 0.98
  tau: 0.9
td_jepa:
  _target_: textjepa.objectives.TDJEPASuccessor
  weight: 0.0  # faithful TD-JEPA successor features (baseline_td_jepa)
  gamma: 0.98
goal_head:
  _target_: textjepa.objectives.GoalHeadDistill
  weight: 0.0  # Takai-style predicted-goal head (baseline_goal_head)
  cos_weight: 1.0
geo_rollout_advantage_mse:
  _target_: textjepa.objectives.GeoRolloutAdvantageRegression
  weight: 0.0
  target_scale: 1.0
geo_rollout_candidate_mse:
  _target_: textjepa.objectives.GeoRolloutCandidateEnergyRegression
  weight: 0.0
counterfactual_outcome:
  _target_: textjepa.objectives.CounterfactualOutcomePrediction
  weight: 0.0  # data-only control: observed alternatives, no preference labels
counterfactual_state:
  _target_: textjepa.objectives.CounterfactualStatePrediction
  weight: 0.0  # full-state alternative analogue of latent_pred
  kind: smooth_l1
  norm_targets: true
counterfactual_token:
  _target_: textjepa.objectives.TokenAlignedCounterfactualPrediction
  weight: 0.0  # exact structured alternative transitions; no quality labels
counterfactual_slot:
  _target_: textjepa.objectives.CounterfactualSlotPrediction
  weight: 0.0  # exact changed-step outcome, no quality or preference label
macro_cf_dynamics:
  _target_: textjepa.objectives.MacroCounterfactualDynamics
  weight: 0.0
  kind: smooth_l1
  norm_targets: true
hierarchy_reachability:
  _target_: textjepa.objectives.HierarchyReachability
  weight: 0.0
  kind: smooth_l1
  norm_targets: true
lower_hierarchy_rollout:
  _target_: textjepa.objectives.LowerHierarchyRollout
  weight: 0.0
  kind: smooth_l1
  norm_targets: true
macro_state_value:
  _target_: textjepa.objectives.MacroStateValue
  weight: 0.0
macro_state_advantage_rank:
  _target_: textjepa.objectives.MacroStateAdvantageRanking
  weight: 0.0
  margin: 0.5
macro_action_value:
  _target_: textjepa.objectives.MacroActionValue
  weight: 0.0
macro_advantage_rank:
  _target_: textjepa.objectives.MacroAdvantageRanking
  weight: 0.0
  margin: 0.5
macro_ood_value_rank:
  _target_: textjepa.objectives.MacroOODValueRanking
  weight: 0.0
  margin: 1.0
subgoal_action_rank:
  _target_: textjepa.objectives.SubgoalActionRanking
  weight: 0.0
  temperature: 1.0
  predicted_weight: 1.0
macro_top1_rank:
  _target_: textjepa.objectives.MacroTop1Ranking
  weight: 0.0
  temperature: 1.0
macro_receding_value:
  _target_: textjepa.objectives.MacroRecedingValue
  weight: 0.0
  discount: 0.5
  tie_break_scale: 0.1
macro_receding_rank:
  _target_: textjepa.objectives.MacroRecedingRanking
  weight: 0.0
  discount: 0.5
  margin: 0.2
macro_support:
  _target_: textjepa.objectives.MacroSupport
  weight: 0.0
  shuffled_weight: 1.0
  perturbed_weight: 1.0
action_feasibility:
  _target_: textjepa.objectives.ActionFeasibility
  weight: 0.0
  positive_weight: 2.0
action_prior:
  _target_: textjepa.objectives.GaussianActionPriorNLL
  weight: 0.0  # NLL of the observed next action under the learned prior
