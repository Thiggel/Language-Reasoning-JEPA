_target_: textjepa.models.DiscourseJEPA
d_model: 256
chunk_layers: 2
chunk_heads: 4
state_layers: 4
state_heads: 8
ff_mult: 4
max_chunk_len: 48
max_chunks: 64
d_action: 16
fsq_levels: null
predictor_hidden_mult: 4
predictor_layers: 2
predictor_heads: 8
n_ops: 4
macro_k: 3
d_macro: 8
macro_encoder_kind: transformer  # transformer | concat
macro_variational: false
macro_concat_width: 8
high_predictor_kind: causal
high_predictor_layers: 2
high_predictor_heads: 8
high_predictor_ff_mult: 4
high_predictor_residual: null
action_support_states: "true"  # true | all (also one-step/open-loop states)
action_prior: false            # learned Gaussian prior p(a | s) over intent embeddings
action_prior_components: 1     # >1: mixture of isotropic Gaussians
action_prior_states: "true"    # true | all (also one-step/open-loop states)
action_prior_candidate_scope: feasible  # feasible | catalogue (learned-catalogue planning)
macro_support_scales: [3.0]
dense_rollout_depth: 0
high_dense_rollout_depth: 0
value_detach: true
geo_rank_score_mode: value  # transition | value | distance | direct | td_q | expectile_value | td_jepa | goal_head
geo_energy_target: advantage  # advantage | distance
geo_energy_state_source: predicted  # predicted | true
geo_energy_rollout_depths: []  # state-Energy calibration at 0=observed, d>0=imagined
geo_energy_rollout_detach_body: false  # isolate head calibration from geometry
geo_rank_rollout_depths: []  # GAR candidates scored from recursively imagined anchors
geo_rank_rollout_detach_body: false  # train only the head on imagined anchors
geo_rank_label_control: "true"  # true | cyclic_shuffle (training-only control)
geo_horizon_supervise_prefixes: false
geo_horizon_prefix_depths: []
geo_horizon_input: true  # false: horizon-blind endpoint Energy (one shared Energy)
geo_td_auxiliary: none  # none | td_q | expectile_value (TD shaping alongside ranking)
td_jepa_d_psi: 32   # successor/state feature width (baseline_td_jepa)
td_jepa_d_task: 32  # task embedding width tau(z_0) (baseline_td_jepa)
dropout: 0.0
geo_proj: false
state_target: ema
predictor_residual: true
predictor_kind: causal
action_encoder_kind: pooled  # pooled | token_bottleneck
action_token_dim: 8          # per-token width before fixed-order concatenation
variational_actions: false
observed_action_ldad: false
observed_action_ldad_horizon: 1
ldad_decoder_layers: 2
