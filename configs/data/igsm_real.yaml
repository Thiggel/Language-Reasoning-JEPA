name: igsm_real
modulus: 23
max_op: 15        # official iGSM-med; hard = 21
max_edge: 20      # official iGSM-med; hard = 28
op_range: [3, 15]
necessary_range: null  # [lo, hi] rejection on solution length (planning bands)
# Vocabulary scan caps. Null = historical 21/28 cache (frozen token list;
# existing checkpoints depend on it). Runs at larger generator caps must set
# these to the training caps so eval-band parameter names are in-vocabulary.
vocab_max_op: null
vocab_max_edge: null
n_vars_range: [6, 12]   # unused by the faithful generator (interface compat)
leaf_prob: 0.35
steps_range: [3, 9]
distractor_prob: 0.15
max_distractors: 2
train_size: 100000
val_size: 5000
test_size: 5000
train_seed: 1
val_seed: 2
test_seed: 3
shuffle_actions: false
n_alt: 0
geo_rank_k: 0
geo_rank_horizon: 1
geo_rank_horizons: null
geo_rank_rollout_for_h1: false
geo_rank_candidate_interface: feasible_menu  # only supported value
geo_rank_factual_only: false                 # only supported value
geo_rank_feasible_k: null                    # only supported value
geo_rank_invalid_k: null                     # only supported value
invalid_action_mode: noop                    # only supported value
geo_rank_rollouts: 1
geo_rank_policy: random
geo_rank_beam_width: 1
invalid_counterfactual_k: 0
invalid_counterfactual_unresolved_only: false
fresh_per_epoch: true
