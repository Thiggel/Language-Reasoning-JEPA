name: igsm
modulus: 23
n_vars_range: [6, 12]
leaf_prob: 0.35
steps_range: [3, 9]
distractor_prob: 0.15
max_distractors: 2
train_size: 100000
val_size: 5000
test_size: 5000
train_seed: 1
val_seed: 2
test_seed: 3
shuffle_actions: false
n_alt: 0
geo_rank_k: 0
geo_rank_horizon: 1
geo_rank_horizons: null
geo_rank_rollouts: 1
geo_rank_rollout_for_h1: false
geo_rank_policy: random  # random | greedy (true outcomes) | latent_beam (EMA predictor)
geo_rank_beam_width: 1   # bounded geometry-greedy continuation; 1 = ordinary greedy
geo_rank_candidate_interface: feasible_menu  # feasible_menu | full_catalogue
geo_rank_feasible_k: null  # stratified full-catalogue sampling; null keeps legacy sampling
geo_rank_invalid_k: null
invalid_action_mode: noop  # noop | failure
macro_alt_k: 0
macro_alt_horizon: 3
all_action_supervision: false
fresh_per_epoch: true
