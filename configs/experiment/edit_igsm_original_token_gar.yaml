# @package _global_
defaults: [edit_igsm_original_token, _self_]
run_name: edit_igsm_original_token_gar
data:
  proposal_pool_k: 8
  proposal_token_pool: prompt_plus_current
  gar_teacher: replacement_distance
model:
  base_q_hidden: 128
objective:
  base_action_value:
    _target_: textjepa.objectives.BaseActionValue
    weight: 1.0
    regression_kind: mse
    regression_weight: 0.25
    pairwise_weight: 1.0
    margin: 0.5
    label_gap: 0.0
  state_goal_distance:
    _target_: textjepa.objectives.StateGoalDistance
    weight: 1.0
