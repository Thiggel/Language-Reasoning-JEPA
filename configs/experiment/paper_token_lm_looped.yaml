# @package _global_
defaults: [paper_token_lm, _self_]
run_name: paper_token_lm_looped
model:
  recurrent: true
  # Eight expected tied-layer visits match the dense token LM's eight
  # Transformer layers in expected training depth.
  train_loop_mean: 8.0
  train_loop_min: 1
  train_loop_max: 32
  eval_loops: 8
  train_loop_distribution: poisson_lognormal
  train_loop_sigma: 0.5
