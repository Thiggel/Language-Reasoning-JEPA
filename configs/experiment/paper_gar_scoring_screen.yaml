# @package _global_
# Matched screen for GAR scoring targets, ranking losses, and horizon Energy.
defaults: [paper_gar_rollout_factorial, _self_]
run_name: paper_gar_scoring_screen
objective:
  rollout: {weight: 0.0, kind: smooth_l1, norm_targets: true}
