ckpt: ???
device: cuda:0
n_episodes: 200
split: val  # use test only after recipe/model selection is frozen
# Optional controlled distribution shift. Null preserves the checkpoint's
# training distribution. Exact-length evaluation should set strict mode and a
# sufficiently large sampling attempt cap.
eval_steps_range: null
eval_n_vars_range: null
eval_leaf_prob: null
eval_sample_max_tries: null
eval_strict_steps_range: null
slack: 0
# One generous-budget run yields success at every slack <= `slack` exactly
# (the policy never reads the budget); adds success_by_slack + excess_steps.
slack_curve: false
lookahead: 1
# Depth > 1 uses the reference graph/environment to propose future feasible
# actions. Keep false for the information-matched evaluation; enable only for
# an explicitly labeled oracle-action diagnostic.
allow_oracle_future_actions: false
prior_top_m: 0  # 0 = no prior filtering; otherwise keep top-M current actions
prior_only: false
proposal_source: current_feasible  # current_feasible | learned_catalogue
proposal_top_m: 0
proposal_beam_width: 1
proposal_prior_weight: 1.0
proposal_support_weight: 1.0
max_expand: 64
search_algorithm: shooting  # shooting | beam
transition_energy_composition: terminal  # terminal | cumulative (control) | root
# For horizon-Energy checkpoints, use the preserved one-step GAR value head
# to prune partial beams and the horizon head only for the final beam choice.
hybrid_local_pruning: false
candidate_interface: feasible_menu  # feasible_menu | full_catalogue | learned_catalogue
# learned_catalogue only: filter catalogue candidates by the learned action
# prior (top-p nucleus over the catalogue-normalized prior, then top-k).
prior_top_k: 0   # 0 = keep all
prior_top_p: 1.0
invalid_action_mode: noop  # noop | failure
# oracle_goal encodes the solved trajectory and scores representation distance.
# symbolic_distance reads exact remaining steps from the environment and also
# requires simulator=symbolic. Both are explicitly oracle diagnostics.
energy: value  # value | oracle_goal | symbolic_distance
score_control: model  # model | shuffle | zero (candidate-leakage controls)
simulator: latent  # latent | symbolic (true environment outcomes; diagnostic)
seed: 321
out: null
# null infers outcome/intent from the training checkpoint. Override only for
# diagnostics; the paper evaluates each LM using its matched training target.
score_kind: null
eval_dataset_seed: null
# Compare candidate strings by mean token likelihood.  Summed likelihood has
# an avoidable preference for shorter intent wording.
length_normalize: true
# Count the actual tensor FLOPs used by the full candidate-scoring evaluator.
# Disabled by default because dispatcher tracing adds evaluation overhead.
measure_flops: false
# Optional sidecar for compute metadata. Keeping this separate from ``out``
# preserves the long-standing planning-metrics JSON schema.
compute_out: null

hydra:
  run:
    dir: runs/_plan
  job:
    chdir: false

hierarchy: false
