ckpt: ???
device: cuda:0
n_episodes: 200
split: val  # use test only after recipe/model selection is frozen
# Optional controlled distribution shift. Null preserves the checkpoint's
# training distribution. Exact-length evaluation should set strict mode and a
# sufficiently large sampling attempt cap.
eval_steps_range: null
eval_n_vars_range: null
eval_leaf_prob: null
eval_sample_max_tries: null
eval_strict_steps_range: null
# Faithful (official-iGSM) OOD knobs: their design shifts the OPERATION
# count, e.g. iGSM-hard trains at op<=21 and tests at op 28-32.
eval_op_range: null
eval_max_op: null
eval_max_edge: null
eval_necessary_range: null  # band on SOLUTION length, not total op count
slack: 0
# Proportional cushion: budget = necessary + slack + ceil(slack_frac*necessary).
# The fixed-slack ruler is not length-invariant (it made long-OOD look easier
# than ID for every policy); paper planning rows use slack_frac.
slack_frac: 0.0
# Score ONE generous-budget run (necessary + slack) at every smaller slack and
# emit success_by_slack plus per-episode excess_steps. The policy never reads
# its budget, so the smaller-slack runs are prefixes of the generous one.
slack_curve: false
lookahead: 1
# Depth > 1 uses the reference graph/environment to propose future feasible
# actions. Keep false for the information-matched evaluation; enable only for
# an explicitly labeled oracle-action diagnostic.
allow_oracle_future_actions: false
lookahead_expansion: oracle_menu  # oracle_menu | ldad_cycle (oracle-free expansion from JEPA-imagined states for feasible_menu roots)
prior_top_m: 0  # 0 = no prior filtering; otherwise keep top-M current actions
prior_only: false
proposal_source: current_feasible  # current_feasible | learned_catalogue
proposal_top_m: 0
proposal_beam_width: 1
proposal_prior_weight: 1.0
proposal_support_weight: 1.0
max_expand: 64
search_algorithm: shooting  # shooting | beam
transition_energy_composition: terminal  # terminal | cumulative (control) | root
# For horizon-Energy checkpoints, use the preserved one-step GAR value head
# to prune partial beams and the horizon head only for the final beam choice.
hybrid_local_pruning: false
candidate_interface: feasible_menu  # feasible_menu | full_catalogue | learned_catalogue | ldad_cycle | generator_cycle | cem_cycle | codebook_cycle | codebook_ground | autonomous
# generator_cycle only (fully open-ended proposals): K intent phrases are
# sampled from the state-conditioned generator head, parsed against the
# problem's action space (unparseable samples discarded and counted), and the
# survivors ranked by LDAD cycle-consistency, keeping prior_top_k. Requires a
# checkpoint with model.action_generator=true AND model.observed_action_ldad=true.
generator_samples: 16
generator_top_p: 1.0
generator_temperature: 1.0
# cem_cycle only (open-ended CEM in the action-embedding space; no menu and no
# catalogue is shown to the planner): a population of action codes is scored by
# the same LDAD cycle as ldad_cycle, the elites are decoded to phrases, and the
# phrases are parsed against the problem's action space (keeping prior_top_k).
# Requires a checkpoint with model.observed_action_ldad=true.
cem_population: 64
cem_elites: 8
cem_iters: 3
# Weight of the off-manifold penalty, in units of the prior's mean embedding
# norm (scale-invariant, so the value transfers across checkpoints).
cem_offmanifold_lambda: 1.0
cem_prior_anchor: 0.1  # mixing weight of the training-phrase Gaussian
# Training problems used only to fit the CEM initialization Gaussian, drawn
# from the checkpoint's own TRAINING distribution (before any eval_*
# distribution-shift override). Using evaluation problems would leak their
# action catalogue.
cem_prior_problems: 64
# codebook_cycle only (open-ended proposals from a discrete action codebook;
# no menu and no catalogue is shown to the planner): K codes are fitted at
# eval time by k-means over the TRAINING action embeddings (same pinned
# distribution and same problem count as cem_prior_problems), every code is
# scored by the LDAD cycle at the current state, decoded to a phrase, and the
# phrases are parsed against the problem's action space (keeping prior_top_k).
# No retraining; requires a checkpoint with model.observed_action_ldad=true.
codebook_k: 64
codebook_seed: 0
# autonomous only (menu-free, oracle-free end-to-end self-rollout): codebook
# proposals grounded environment-side, endpoint-Energy beam search, and the
# DETACHED frozen-state sentence decoder emitting each step's text, which is
# appended to the model's own context and re-encoded. The oracle executor is
# never called; ground truth scores the FINAL ANSWER only. Requires a decoder
# trained by scripts/train_state_decoder.py on this checkpoint.
state_decoder: null
# Stop as soon as the rollout writes a step sentence about the queried
# variable (its own completion claim). False keeps writing to the budget and
# scores the LAST such sentence, so a premature claim can still be revised.
autonomous_stop_on_claim: true
# LDAD cycle-consistency feasibility gate: drop proposals whose own intent
# phrase the displacement decoder cannot reconstruct at the current state,
# before the Energy search sees them. The threshold is the given quantile of
# the cycle scores of genuinely feasible actions on TRAINING problems (labels
# used at calibration time only, never at plan time, never on eval data).
# Set false for the ungated ablation.
autonomous_feasibility_gate: true
# midpoint: halfway between the mean cycle score of feasible and of
# infeasible TRAINING actions. quantile: the given quantile of the feasible
# training scores (their low tail makes this a much looser cut).
autonomous_gate_calibration: midpoint
autonomous_gate_quantile: 0.1
autonomous_gate_problems: 32
# learned_catalogue only: filter catalogue candidates by the learned action
# prior (top-p nucleus over the catalogue-normalized prior, then top-k).
prior_top_k: 0   # 0 = keep all
prior_top_p: 1.0
prior_feasibility_gate: false
invalid_action_mode: noop  # noop | failure
# Menu-free interfaces only (faithful iGSM full_catalogue): exclude the
# policy's OWN already-attempted actions from later candidate sets. This is
# self-knowledge, not an oracle, and it is what prevents the invalid=noop
# lock-in loop (an unchanged state re-selects the same infeasible action).
# Set false for the labeled unmasked ablation.
mask_attempted: true
# oracle_goal encodes the solved trajectory and scores representation distance.
# symbolic_distance reads exact remaining steps from the environment and also
# requires simulator=symbolic. Both are explicitly oracle diagnostics.
energy: value  # value | oracle_goal | symbolic_distance
score_control: model  # model | shuffle | zero (candidate-leakage controls)
simulator: latent  # latent | symbolic (true environment outcomes; diagnostic)
seed: 321
out: null
# null infers outcome/intent from the training checkpoint. Override only for
# diagnostics; the paper evaluates each LM using its matched training target.
score_kind: null
# Sentence-LM evaluation rule (scripts/plan_sentlm.py). The sentence-plus-
# latent row is ONE trained model with TWO predeclared rules: `decoder`
# (candidate reconstruction likelihood) and `latent` (LN-L1 distance to the
# predicted next latent). Not a tuning knob.
score: decoder
# Recurrent (weight-shared) LM rows only: number of shared-block loops at
# evaluation. Null keeps the checkpoint's trained default. The paper contract
# evaluates loops {1,2,4,8,16}. This is NOT a planning depth.
eval_loops: null
eval_dataset_seed: null
# Compare candidate strings by mean token likelihood.  Summed likelihood has
# an avoidable preference for shorter intent wording.
length_normalize: true
# Count the actual tensor FLOPs used by the full candidate-scoring evaluator.
# Disabled by default because dispatcher tracing adds evaluation overhead.
measure_flops: false
# Optional sidecar for compute metadata. Keeping this separate from ``out``
# preserves the long-standing planning-metrics JSON schema.
compute_out: null

hydra:
  run:
    dir: runs/_plan
  job:
    chdir: false

hierarchy: false
